services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: agrishield_infra_postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agrishield_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agrishield_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-agrishield_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./docker/postgres/init-postgis.sql:/docker-entrypoint-initdb.d/01-init-postgis.sql
      - postgres_infra_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agrishield_user} -d ${POSTGRES_DB:-agrishield_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agrishield_infra_net

  redis:
    image: redis:7-alpine
    container_name: agrishield_infra_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_infra_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agrishield_infra_net

  minio:
    image: minio/minio:latest
    container_name: agrishield_infra_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minio_admin_user}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minio_admin_secure_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_infra_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - agrishield_infra_net

volumes:
  postgres_infra_data:
    driver: local
  redis_infra_data:
    driver: local
  minio_infra_data:
    driver: local

networks:
  agrishield_infra_net:
    driver: bridge
