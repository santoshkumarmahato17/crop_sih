dataset:
  name: "Tomato Leaf Disease Dataset"
  default_path: "Tomato"
  classes:
    - "Healthy"
    - "Leaf Blight"
    - "Leaf Curl"
    - "Septoria Leaf Spot"
    - "Verticillium Wilt"
  folder_mapping:
    "healthy": "Healthy"
    "leaf blight": "Leaf Blight"
    "leaf curl": "Leaf Curl"
    "septoria leaf spot": "Septoria Leaf Spot"
    "verticulium wilt": "Verticillium Wilt"
    "verticillium wilt": "Verticillium Wilt"

splits:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  random_seed: 42
  deduplicate: true

training:
  backbone: "mobilenet_v3_small"
  pretrained: true
  input_size: 224
  batch_size: 32
  num_workers: 0
  warmup_epochs: 2
  finetune_epochs: 4
  warmup_lr: 0.001
  finetune_lr: 0.0003
  weight_decay: 0.0001
  use_class_weights: true
  early_stopping_patience: 3

inference:
  confidence_threshold: 0.70
  blur_laplacian_threshold: 60.0
  min_brightness: 25.0
  max_brightness: 235.0

paths:
  splits_dir: "ml/data/splits"
  models_dir: "ml/models"
  reports_dir: "ml/reports"
